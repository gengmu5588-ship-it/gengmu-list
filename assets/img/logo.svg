<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="视觉社 logo">
  <defs>
    <linearGradient id="body" x1="0.2" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.34" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.42" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3B0F76"/>
    </radialGradient>
    <linearGradient id="blush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2E1065" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 身体：圆润的四边形卡通体 -->
  <rect x="44" y="52" width="424" height="408" rx="150" ry="150" fill="url(#body)" filter="url(#soft)"/>
  <rect x="44" y="52" width="424" height="408" rx="150" ry="150" fill="url(#gloss)"/>

  <!-- 眼白 -->
  <ellipse cx="256" cy="238" rx="132" ry="128" fill="#FFFFFF"/>
  <ellipse cx="256" cy="238" rx="132" ry="128" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="6"/>

  <!-- 虹膜 -->
  <circle cx="256" cy="242" r="78" fill="url(#iris)"/>
  <circle cx="256" cy="242" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5"/>
  <!-- 瞳孔 -->
  <circle cx="256" cy="244" r="42" fill="#160A2E"/>
  <!-- 高光 -->
  <circle cx="232" cy="216" r="17" fill="#FFFFFF"/>
  <circle cx="286" cy="272" r="8" fill="#FFFFFF" fill-opacity="0.65"/>
  <circle cx="290" cy="206" r="6" fill="#F9A8D4"/>

  <!-- 腮红 -->
  <ellipse cx="112" cy="352" rx="34" ry="22" fill="url(#blush)" opacity="0.55"/>
  <ellipse cx="400" cy="352" rx="34" ry="22" fill="url(#blush)" opacity="0.55"/>

  <!-- 微笑 -->
  <path d="M212 366 C226 394 286 394 300 366" fill="none" stroke="#2E1065" stroke-opacity="0.55"
        stroke-width="12" stroke-linecap="round"/>

  <!-- 闪光 -->
  <path d="M430 116 L439 140 L463 149 L439 158 L430 182 L421 158 L397 149 L421 140 Z" fill="#FCD34D"/>
  <path d="M92 214 L98 230 L114 236 L98 242 L92 258 L86 242 L70 236 L86 230 Z" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
