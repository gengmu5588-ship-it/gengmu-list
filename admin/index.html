<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视觉社 · 管理后台</title>
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/logo-192.png">
<style>
  :root{
    --bg:#0b0a12; --panel:#14111f; --panel-2:#1a1626; --line:rgba(139,92,246,.18);
    --primary:#8b5cf6; --primary-2:#a78bfa; --text:#ece9f7; --muted:#9b95b3;
    --green:#34d399; --amber:#fbbf24; --red:#f87171; --radius:14px;
    color-scheme: dark;
  }
  /* ===== 亮色（白色）主题 ===== */
  html[data-theme="light"]{
    --bg:#f6f6fb; --panel:#ffffff; --panel-2:#f5f4fb; --line:rgba(109,40,217,.16);
    --primary:#7c3aed; --primary-2:#6d28d9; --text:#17131f; --muted:#6b6680;
    --green:#059669; --amber:#b45309; --red:#dc2626;
    color-scheme: light;
  }
  html[data-theme="light"] .login-wrap{
    background:radial-gradient(1200px 600px at 20% 0%,rgba(139,92,246,.10),transparent 60%),var(--bg);
  }
  html[data-theme="light"] .login-card{box-shadow:0 20px 50px rgba(23,19,31,.12)}
  html[data-theme="light"] .side nav a.on{color:var(--primary)}
  html[data-theme="light"] .tabs button.on{color:var(--primary)}
  html[data-theme="light"] .table th{background:rgba(23,19,31,.03)}
  html[data-theme="light"] .table td{border-bottom-color:rgba(23,19,31,.06)}
  html[data-theme="light"] .mask{background:rgba(23,19,31,.42)}
  html[data-theme="light"] .modal{box-shadow:0 24px 60px rgba(23,19,31,.18)}
  html[data-theme="light"] .modal-x:hover{color:var(--text);border-color:#d2cfe3;background:rgba(23,19,31,.05)}
  html[data-theme="light"] .tag-gray{background:rgba(23,19,31,.05);border-color:rgba(23,19,31,.1)}
  html[data-theme="light"] .tag-green{background:rgba(5,150,105,.1);color:#047857;border-color:rgba(5,150,105,.28)}
  html[data-theme="light"] .tag-amber{background:rgba(180,83,9,.1);color:#b45309;border-color:rgba(180,83,9,.28)}
  html[data-theme="light"] .tag-red{background:rgba(220,38,38,.1);color:#b91c1c;border-color:rgba(220,38,38,.26)}
  html[data-theme="light"] .tag-violet{background:rgba(124,58,237,.1);color:#6d28d9;border-color:rgba(124,58,237,.28)}
  html[data-theme="light"] .btn-danger{color:#b91c1c}
  html[data-theme="light"] .btn-ok{color:#047857}
  html[data-theme="light"] .notice{color:#b45309}
  html[data-theme="light"] .toast{background:#1f1b2e;box-shadow:0 12px 30px rgba(23,19,31,.22)}
  /* 主题切换按钮 */
  .theme-sw{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;user-select:none}
  .theme-sw:hover{color:var(--primary-2)}
  .theme-sw-float{position:fixed;right:18px;top:18px;z-index:50;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.18s}
  .theme-sw-float:hover{color:var(--primary-2);border-color:var(--primary)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px; line-height:1.6; min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  /* 登录 */
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
    background:radial-gradient(1200px 600px at 20% 0%,rgba(139,92,246,.18),transparent 60%),var(--bg)}
  .login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .login-card .logo-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#ec4899);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
  .login-card h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .login-card p{color:var(--muted);font-size:13px;margin-bottom:24px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;color:var(--text);outline:none;transition:.2s}
  .input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:10px;
    padding:9px 16px;cursor:pointer;font-weight:600;transition:.18s;background:var(--panel-2);color:var(--text)}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:rgba(255,255,255,.12);color:#fff}
  .btn-primary:hover{box-shadow:0 8px 24px rgba(139,92,246,.35)}
  .btn-ghost{border-color:var(--line);background:transparent}
  .btn-danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:#fca5a5}
  .btn-ok{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35);color:#6ee7b7}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
  /* 布局 */
  .layout{display:flex;min-height:100vh}
  .side{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
  .brand b{display:block;font-size:16px;letter-spacing:1px}
  .brand em{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:2px}
  .side nav{flex:1;padding:12px 10px;overflow:auto}
  .side nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    color:var(--muted);font-size:13px;margin-bottom:2px;transition:.18s}
  .side nav a:hover{background:var(--panel-2);color:var(--text)}
  .side nav a.on{background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(236,72,153,.10));
    color:#fff;border:1px solid var(--line)}
  .side-foot{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12px}
  .side-foot a{color:var(--muted)}
  .side-foot a:hover{color:var(--primary-2)}
  .main{flex:1;min-width:0;padding:24px 28px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .topbar h1{font-size:20px;font-weight:700}
  .topbar .who{font-size:12px;color:var(--muted)}
  /* 卡片与表格 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .k{font-size:12px;color:var(--muted);margin-bottom:4px}
  .stat .v{font-size:24px;font-weight:700;letter-spacing:.5px}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-head h2{font-size:15px}
  .panel-head .actions{display:flex;gap:8px;flex-wrap:wrap}
  .table{width:100%;border-collapse:collapse}
  .table th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;
    border-bottom:1px solid var(--line);white-space:nowrap;background:rgba(255,255,255,.02)}
  .table td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
  .table tr:last-child td{border-bottom:none}
  .table td .t{display:block;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .table td .sub{font-size:11px;color:var(--muted)}
  .cell-actions{display:flex;gap:6px;flex-wrap:wrap}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;line-height:1.8;white-space:nowrap}
  .tag-green{background:rgba(52,211,153,.12);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}
  .tag-amber{background:rgba(251,191,36,.12);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
  .tag-red{background:rgba(248,113,113,.12);color:#fca5a5;border:1px solid rgba(248,113,113,.3)}
  .tag-gray{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid rgba(255,255,255,.1)}
  .tag-violet{background:rgba(139,92,246,.15);color:#c4b5fd;border:1px solid rgba(139,92,246,.35)}
  .empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:13px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--muted);font-size:12px;cursor:pointer}
  .tabs button.on{background:rgba(139,92,246,.18);color:#fff;border-color:rgba(139,92,246,.45)}
  .notice{padding:12px 16px;border-radius:12px;background:rgba(251,191,36,.08);
    border:1px solid rgba(251,191,36,.25);color:#fcd34d;font-size:12.5px;margin-bottom:18px}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(4,3,10,.72);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
  .modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal h3{padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px}
  .modal-body{padding:18px 20px}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(10px);
    background:#241f35;border:1px solid var(--line);color:#fff;padding:10px 18px;border-radius:10px;
    font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:820px){
    .layout{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .brand{padding:14px 16px;border-bottom:none}
    .side nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px}
    .side nav a{margin:0}
    .side-foot{flex-direction:row;border-top:none}
    .main{padding:18px 16px 48px}
    .table{display:block;overflow-x:auto;white-space:nowrap}
  }

    .at-mark {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-radius: 4px;
      padding: 0 3px;
      font-weight: 600;
    }
    .comment-text { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    table .sub + .tag, table .tag + .sub { margin-left: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const Admin = (() => {
  const TOKEN_KEY = 'vision_token';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = t => t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : '-';

  let state = {
    nav: 'overview', postTab: 'all', commentTab: 'at',
    data: { articles: [], posts: [], persons: [], works: [], banner: [], categories: { resourceTypes: [], netdiskTypes: [], personTags: [] }, users: [], logs: [], stats: {} }
  };
  let lastQuery = '';
  let adminUser = null;

  /* ===== 基础 ===== */
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  async function api(path, options = {}) {
    const headers = Object.assign({}, options.headers || {});
    if (options.body !== undefined && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    const token = localStorage.getItem(TOKEN_KEY) || '';
    if (token) headers.Authorization = `Bearer ${token}`;
    const res = await fetch(path, Object.assign({}, options, { headers }));
    let data = null;
    try { data = await res.json(); } catch { data = null; }
    if (!res.ok) throw new Error((data && data.error) || `请求失败（${res.status}）`);
    return data;
  }

  async function loadAdmin() {
    state.data = await api('/api/admin/bootstrap');
  }

  const get = k => {
    const d = state.data;
    if (k === 'userPoints') return (d.users || []).map(u => Object.assign({ userId: u.id }, u.points || { available: 0, frozen: 0, totalGain: 0 }));
    if (k === 'pointLogs') return d.logs || [];
    return d[k] !== undefined && d[k] !== null ? d[k] : [];
  };
  const set = () => { /* 数据写入统一走 API */ };
  function pointsOf(id) {
    const u = (state.data.users || []).find(x => x.id === id);
    return (u && u.points) || { available: 0, frozen: 0, totalGain: 0 };
  }
  function personName(id) {
    const p = (state.data.persons || []).find(x => x.id === id);
    return p ? p.name : '（人物已删除）';
  }

  /* ===== 登录 ===== */
  function isAdmin() { return !!adminUser; }
  function renderLogin(msg) {
    document.getElementById('app').innerHTML = `
      <div class="login-wrap">
        <button class="theme-sw-float" onclick="Admin.toggleTheme()"><span data-theme-icon>🌙</span><span data-theme-label>亮色模式</span></button>
        <div class="login-card">
          <div class="logo-row"><img src="/assets/img/logo.svg" alt="视觉社" width="40" height="40" style="border-radius:12px"><div><h1>视觉社 · 管理后台</h1></div></div>
          <p>请输入管理员账号密码（默认 admin / 123456）</p>
          <div class="field"><label>账号</label><input class="input" id="lg-user" placeholder="账号" value="admin"></div>
          <div class="field"><label>密码</label><input class="input" id="lg-pwd" type="password" placeholder="密码"></div>
          <div class="field" style="display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="lg-remember" style="width:auto">
            <label for="lg-remember" style="margin:0;color:var(--muted);font-size:12px">下次自动登录</label>
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" id="lg-btn">登 录</button>
          <p style="margin:16px 0 0;text-align:center"><a href="../index.html" style="color:var(--muted)">← 返回前台</a></p>
        </div>
      </div>`;
    const doLogin = async () => {
      const u = document.getElementById('lg-user').value.trim();
      const p = document.getElementById('lg-pwd').value;
      if (!u || !p) { toast('请输入账号和密码'); return; }
      const btn = document.getElementById('lg-btn');
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        const r = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
        if (!r.user || r.user.role !== 'admin') { toast('该账号不是管理员'); return; }
        localStorage.setItem(TOKEN_KEY, r.token);
        adminUser = r.user;
        toast('登录成功');
        go('overview');
      } catch (e) {
        toast(e.message);
      } finally {
        btn.disabled = false; btn.textContent = '登 录';
      }
    };
    document.getElementById('lg-btn').onclick = doLogin;
    document.getElementById('lg-pwd').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
    syncTheme();
  }
  function logout() {
    localStorage.removeItem(TOKEN_KEY);
    adminUser = null;
    renderLogin();
  }

  /* ===== 框架 ===== */
  const NAV = [
    ['overview', '📊', '数据概览'],
    ['posts', '📝', '帖子审核'],
    ['comments', '💬', '帖子留言'],
    ['persons', '👤', '姬查查人物'],
    ['works', '🎬', '作品管理'],
    ['users', '👥', '用户管理'],
    ['points', '💰', '积分管理'],
    ['articles', '📌', '站长推荐'],
    ['banner', '🖼️', 'Banner'],
    ['categories', '🏷️', '分类配置'],
    ['backup', '💾', '数据备份'],
  ];
  const TITLES = Object.fromEntries(NAV.map(n => [n[0], n[2]]));

  function shell(active, content) {
    const nav = NAV.map(([k, ic, label]) =>
      `<a class="${active === k ? 'on' : ''}" onclick="Admin.go('${k}')">${ic}<span>${label}</span></a>`).join('');
    document.getElementById('app').innerHTML = `
      <div class="layout">
        <aside class="side">
          <div class="brand" style="display:flex;align-items:center;gap:10px">
            <img src="/assets/img/logo.svg" alt="" width="30" height="30" style="border-radius:9px">
            <div><b>视觉社</b><em>ADMIN CONSOLE</em></div>
          </div>
          <nav>${nav}</nav>
          <div class="side-foot">
            <a class="theme-sw" onclick="Admin.toggleTheme()"><span data-theme-icon>🌙</span><span data-theme-label>亮色模式</span></a>
            <a href="../index.html">← 返回前台</a>
            <a onclick="Admin.logout()">退出登录</a>
          </div>
        </aside>
        <main class="main">
          <header class="topbar">
            <h1>${TITLES[active] || ''}</h1>
            <div class="who">admin · ${new Date().toLocaleDateString('zh-CN')}</div>
          </header>
          ${content}
        </main>
      </div>`;
    syncTheme();
  }

  /* ===== 黑白主题 ===== */
  function syncTheme() {
    const light = document.documentElement.getAttribute('data-theme') === 'light';
    document.querySelectorAll('[data-theme-icon]').forEach(el => { el.textContent = light ? '🌙' : '☀️'; });
    document.querySelectorAll('[data-theme-label]').forEach(el => { el.textContent = light ? '暗色模式' : '亮色模式'; });
  }
  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('vs-admin-theme', next); } catch (e) {}
    syncTheme();
  }

  async function go(k) {
    if (!isAdmin()) { renderLogin(); return; }
    state.nav = k;
    try {
      await loadAdmin();
    } catch (e) {
      const msg = String(e.message || '');
      if (msg.includes('登录') || msg.includes('管理员') || msg.includes('权限')) { logout(); return; }
      toast(msg || '数据加载失败');
    }
    const map = {
      overview: renderOverview, posts: renderPosts, comments: renderComments, persons: renderPersons,
      works: renderWorks, users: renderUsers, points: renderPoints, articles: renderArticles,
      banner: renderBanner, categories: renderCategories, backup: renderBackup
    };
    shell(k, (map[k] || renderOverview)());
  }

  /* ===== 概览 ===== */
  function renderOverview() {
    const posts = get('posts'), users = get('users'), persons = get('persons'), works = get('works');
    const pendingPosts = posts.filter(p => p.status === 'pending').length;
    const pendingWorks = works.filter(w => w.status === 'pending').length;
    const openRewards = posts.filter(p => p.type === 'demand' && p.rewardPoint > 0 && !p.isFinish);
    const frozenTotal = get('userPoints').reduce((s, p) => s + (p.frozen || 0), 0);
    const availableTotal = get('userPoints').reduce((s, p) => s + (p.available || 0), 0);
    return `
      <div class="notice">当前后台数据来自服务器 SQLite 数据库，所有管理员操作会实时写入数据库并同步到前台所有设备。</div>
      <div class="cards">
        <div class="stat"><div class="k">帖子总数</div><div class="v">${posts.length}<small>待审 ${pendingPosts}</small></div></div>
        <div class="stat"><div class="k">注册用户</div><div class="v">${users.length}<small>人</small></div></div>
        <div class="stat"><div class="k">姬查查人物</div><div class="v">${persons.length}<small>位</small></div></div>
        <div class="stat"><div class="k">作品总数</div><div class="v">${works.length}<small>待审 ${pendingWorks}</small></div></div>
        <div class="stat"><div class="k">未结单悬赏</div><div class="v">${openRewards.length}<small>笔</small></div></div>
        <div class="stat"><div class="k">冻结积分</div><div class="v">${frozenTotal}<small>可用 ${availableTotal}</small></div></div>
      </div>
      <div class="panel" style="margin-bottom:18px">
        <div class="panel-head"><h2>待处理事项</h2></div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>事项</th><th>数量</th><th>操作</th></tr></thead>
            <tbody>
              <tr><td>待审核帖子</td><td><span class="tag ${pendingPosts ? 'tag-amber' : 'tag-gray'}">${pendingPosts}</span></td>
                  <td class="cell-actions"><button class="btn btn-sm btn-ghost" onclick="Admin.go('posts')">去审核</button></td></tr>
              <tr><td>待审核作品</td><td><span class="tag ${pendingWorks ? 'tag-amber' : 'tag-gray'}">${pendingWorks}</span></td>
                  <td class="cell-actions"><button class="btn btn-sm btn-ghost" onclick="Admin.go('works')">去审核</button></td></tr>
              <tr><td>评论区 @管理员（未处理）</td><td><span class="tag ${(get('stats').pendingMentions || 0) ? 'tag-red' : 'tag-gray'}">${get('stats').pendingMentions || 0}</span></td>
                  <td class="cell-actions"><button class="btn btn-sm btn-ghost" onclick="Admin.go('comments')">去处理</button></td></tr>
              <tr><td>未结单悬赏</td><td><span class="tag ${openRewards.length ? 'tag-violet' : 'tag-gray'}">${openRewards.length}</span></td>
                  <td class="cell-actions"><button class="btn btn-sm btn-ghost" onclick="Admin.go('posts')">去处理</button></td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>最近积分流水</h2></div>
        <div class="table-wrap">${logsTable(get('pointLogs').slice(0, 10))}</div>
      </div>`;
  }

  function logsTable(logs) {
    if (!logs.length) return '<div class="empty">暂无流水</div>';
    return `<table class="table">
      <thead><tr><th>用户</th><th>变动</th><th>类型</th><th>备注</th><th>时间</th></tr></thead>
      <tbody>${logs.map(l => `<tr>
        <td>${esc(l.userId)}</td>
        <td style="color:${l.point >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:600">${l.point >= 0 ? '+' : ''}${l.point}</td>
        <td><span class="tag tag-gray">${esc(l.type)}</span></td>
        <td><span class="t">${esc(l.remark || '-')}</span></td>
        <td><span class="sub">${fmt(l.createdAt)}</span></td>
      </tr>`).join('')}</tbody></table>`;
  }

  /* ===== 帖子审核 ===== */
  const STATUS = {
    approved: ['已通过', 'tag-green'],
    pending: ['待审核', 'tag-amber'],
    rejected: ['已驳回', 'tag-red'],
  };
  function renderPosts() {
    const tab = state.postTab;
    let posts = get('posts');
    if (tab === 'pending') posts = posts.filter(p => p.status === 'pending');
    else if (tab === 'demand') posts = posts.filter(p => p.type === 'demand');
    else if (tab === 'share') posts = posts.filter(p => p.type === 'share');
    const tabs = [['all','全部'],['pending','待审核'],['demand','求资源'],['share','我分享']]
      .map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="Admin.setPostTab('${k}')">${l}</button>`).join('');
    const rows = posts.map(p => {
      const st = STATUS[p.status] || ['未知', 'tag-gray'];
      const isDemand = p.type === 'demand';
      const pointTag = isDemand
        ? (p.rewardPoint > 0 ? `<span class="tag tag-violet">🏆 ${p.rewardPoint}</span>` : '<span class="tag tag-gray">无悬赏</span>')
        : (p.unlockPoint > 0 ? `<span class="tag tag-violet">🔒 ${p.unlockPoint}</span>` : '<span class="tag tag-green">免费</span>');
      const finishTag = isDemand && p.isFinish ? '<span class="tag tag-gray">已结单</span>' : '';
      const rewardBtns = isDemand && p.rewardPoint > 0 && !p.isFinish ? `
        <button class="btn btn-sm btn-ok" onclick="Admin.finishDemand('${p.id}')">结单发放</button>
        <button class="btn btn-sm btn-ghost" onclick="Admin.refundDemand('${p.id}')">退回悬赏</button>` : '';
      return `<tr>
        <td><span class="tag ${isDemand ? 'tag-violet' : 'tag-gray'}">${isDemand ? '求资源' : '我分享'}</span></td>
        <td><span class="t" title="${esc(p.title)}">${esc(p.title)}</span><span class="sub">${esc(p.resourceType || '')} · ${esc(p.userName || p.userId || '')}</span></td>
        <td>${pointTag}</td>
        <td><span class="tag ${st[1]}">${st[0]}</span> ${finishTag}</td>
        <td><span class="sub">${fmt(p.createdAt)}</span></td>
        <td><div class="cell-actions">
          ${p.status !== 'approved' ? `<button class="btn btn-sm btn-ok" onclick="Admin.setStatus('${p.id}','approved')">通过</button>` : ''}
          ${p.status !== 'rejected' ? `<button class="btn btn-sm btn-ghost" onclick="Admin.setStatus('${p.id}','rejected')">驳回</button>` : ''}
          ${p.type === 'share' && p.status === 'approved' ? `<button class="btn btn-sm btn-primary" onclick="Admin.postToArticle('${p.id}')">发布为推荐</button>` : ''}
          ${rewardBtns}
          <button class="btn btn-sm btn-danger" onclick="Admin.delPost('${p.id}')">删除</button>
        </div></td>
      </tr>`;
    }).join('');
    return `
      <div class="panel-head" style="border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;background:var(--panel)">
        <div class="tabs">${tabs}</div>
        <div class="actions"><span class="sub">共 ${posts.length} 条</span></div>
      </div>
      <div class="panel"><div class="table-wrap">
        ${posts.length ? `<table class="table">
          <thead><tr><th>类型</th><th>标题 / 作者</th><th>积分</th><th>状态</th><th>发布时间</th><th>操作</th></tr></thead>
          <tbody>${rows}</tbody></table>` : '<div class="empty">暂无帖子</div>'}
      </div></div>`;
  }
  /* ===== 帖子留言（@管理员） ===== */
  function renderComments() {
    const all = get('postComments') || [];
    const tab = state.commentTab || 'at';
    let list = all;
    if (tab === 'at') list = all.filter(c => c.mentionAdmin && !c.mentionHandled);
    else if (tab === 'done') list = all.filter(c => c.mentionAdmin && c.mentionHandled);

    const tabs = [
      ['at', `@管理员 未处理 ${all.filter(c => c.mentionAdmin && !c.mentionHandled).length}`],
      ['all', `全部留言 ${all.length}`],
      ['done', '已处理'],
    ].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="Admin.setCommentTab('${k}')">${l}</button>`).join('');

    const rows = list.map(c => {
      const content = esc(c.content).replace(/@\s*(管理员|admin)/gi, m => `<mark class="at-mark">${m}</mark>`);
      const typeTag = c.postType === 'demand' ? '悬赏区' : '资源区';
      return `<tr>
        <td><span class="sub">${fmt(c.createdAt)}</span></td>
        <td><span class="t">${esc(c.userName || c.userId)}</span></td>
        <td style="max-width:520px"><div class="comment-text">${content}</div></td>
        <td>${c.mentionAdmin
          ? (c.mentionHandled
            ? '<span class="tag tag-gray">已处理</span>'
            : '<span class="tag tag-amber">🔔 @管理员</span>')
          : '<span class="sub">-</span>'}</td>
        <td><span class="tag tag-gray">${typeTag}</span><span class="sub">${esc(c.postTitle || '（帖子已删除）')}</span></td>
        <td><div class="cell-actions">
          ${c.mentionAdmin && !c.mentionHandled ? `<button class="btn btn-sm btn-ok" onclick="Admin.handleMention('${c.id}')">标记已处理</button>` : ''}
          <button class="btn btn-sm btn-danger" onclick="Admin.delPostComment('${c.id}')">删除</button>
        </div></td>
      </tr>`;
    }).join('');

    return `
      <div class="panel-head" style="border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;background:var(--panel)">
        <div class="tabs">${tabs}</div>
        <div class="actions"><span class="sub">共 ${list.length} 条</span></div>
      </div>
      <div class="panel"><div class="table-wrap">
        ${list.length ? `<table class="table">
          <thead><tr><th>时间</th><th>用户</th><th>留言内容</th><th>@ 标记</th><th>所属帖子</th><th>操作</th></tr></thead>
          <tbody>${rows}</tbody></table>` : '<div class="empty">暂无留言</div>'}
      </div></div>`;
  }

  async function setCommentTab(k) {
    state.commentTab = k;
    shell('comments', renderComments());
  }

  async function handleMention(id) {
    try {
      await api(`/api/admin/post-comments/${id}/handle`, { method: 'POST', body: '{}' });
      toast('已标记处理');
      go('comments');
    } catch (e) { toast(e.message); }
  }

  async function delPostComment(id) {
    if (!confirm('确认删除这条留言？')) return;
    try {
      await api(`/api/admin/post-comments/${id}`, { method: 'DELETE' });
      toast('已删除');
      go('comments');
    } catch (e) { toast(e.message); }
  }

  async function setStatus(id, status) {
    try {
      await api(`/api/admin/posts/${id}/status`, { method: 'POST', body: JSON.stringify({ status }) });
      toast(status === 'approved' ? '已通过' : '已驳回');
      go('posts');
    } catch (e) { toast(e.message); }
  }
  async function delPost(id) {
    const p = (state.data.posts || []).find(x => x.id === id);
    if (!p) return;
    if (!confirm(`确认删除「${p.title}」？`)) return;
    try {
      await api(`/api/admin/posts/${id}`, { method: 'DELETE' });
      toast('已删除');
      go('posts');
    } catch (e) { toast(e.message); }
  }
  function finishDemand(id) {
    const p = (state.data.posts || []).find(x => x.id === id);
    if (!p || p.isFinish) return;
    const candidates = get('users');
    const listHint = candidates.length
      ? candidates.slice(0, 8).map(u => `${esc(u.nickname || u.username)}（${esc(u.id)}）`).join('<br>')
      : '暂无注册用户';
    const body = `
      <div class="field"><label>悬赏金额</label><input class="input" value="${p.rewardPoint}" disabled></div>
      <div class="field"><label>采纳者用户 ID</label><input class="input" id="f-receiver" placeholder="输入获得悬赏的用户 ID">
        <div class="hint">可选用户：<br>${listHint}</div>
      </div>`;
    openModal('结单发放悬赏', body, async () => {
      const receiver = document.getElementById('f-receiver').value.trim();
      if (!receiver) { toast('请填写采纳者 ID'); return false; }
      try {
        await api(`/api/admin/posts/${id}/finish`, { method: 'POST', body: JSON.stringify({ receiverId: receiver }) });
      } catch (e) { toast(e.message); return false; }
      toast('已发放悬赏');
      setTimeout(() => go('posts'), 60);
      return true;
    });
  }
  async function refundDemand(id) {
    const p = (state.data.posts || []).find(x => x.id === id);
    if (!p || p.isFinish) return;
    if (!confirm(`确认退回 ${p.rewardPoint} 积分给发帖人？`)) return;
    try {
      await api(`/api/admin/posts/${id}/refund`, { method: 'POST', body: '{}' });
      toast('已退回悬赏');
      go('posts');
    } catch (e) { toast(e.message); }
  }

  /* ===== 人物 ===== */
  function renderPersons() {
    const persons = get('persons');
    const rows = persons.map(p => {
      const works = get('works').filter(w => w.personId === p.id).length;
      return `<tr>
        <td style="width:56px">${p.avatar ? `<img src="${esc(p.avatar)}" alt="" style="width:40px;height:40px;border-radius:10px;object-fit:cover">` : '<span class="tag tag-gray">无图</span>'}</td>
        <td><span class="t">${esc(p.name)}</span><span class="sub">${esc(p.bio || '-')}</span></td>
        <td><span class="tag tag-violet">${esc(p.tag || '未分类')}</span></td>
        <td>${works}</td>
        <td><span class="sub">${esc(p.baiduUrl ? '已填写' : '未填写')}</span></td>
        <td><div class="cell-actions">
          <button class="btn btn-sm btn-ghost" onclick="Admin.editPerson('${p.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="Admin.delPerson('${p.id}')">删除</button>
        </div></td>
      </tr>`;
    }).join('');
    return `
      <div class="panel-head" style="border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;background:var(--panel)">
        <h2>共 ${persons.length} 位人物</h2>
        <div class="actions"><button class="btn btn-sm btn-primary" onclick="Admin.editPerson()">+ 新增人物</button></div>
      </div>
      <div class="panel"><div class="table-wrap">
        ${persons.length ? `<table class="table">
          <thead><tr><th>头像</th><th>姓名 / 简介</th><th>标签</th><th>作品数</th><th>百科</th><th>操作</th></tr></thead>
          <tbody>${rows}</tbody></table>` : '<div class="empty">还没有人物，点击右上角新增</div>'}
      </div></div>`;
  }
  function editPerson(id) {
    const p = id ? get('persons').find(x => x.id === id) : {};
    const tags = (get('categories').personTags) || [];
    openModal(id ? '编辑人物' : '新增人物', `
      <div class="field"><label>姓名 *</label><input class="input" id="f-name" value="${esc(p.name || '')}"></div>
      <div class="field"><label>标签</label><input class="input" id="f-tag" value="${esc(p.tag || '')}" placeholder="如：演员 / 网红（可选：${esc(tags.join('、'))}）"></div>
      <div class="field"><label>头像 URL</label><input class="input" id="f-avatar" value="${esc(p.avatar || '')}"></div>
      <div class="field"><label>简介</label><textarea id="f-bio" rows="3">${esc(p.bio || '')}</textarea></div>
      <div class="field"><label>百度百科链接</label><input class="input" id="f-baidu" value="${esc(p.baiduUrl || '')}"></div>`, async () => {
      const v = {
        name: document.getElementById('f-name').value.trim(),
        tag: document.getElementById('f-tag').value.trim(),
        avatar: document.getElementById('f-avatar').value.trim(),
        bio: document.getElementById('f-bio').value.trim(),
        baiduUrl: document.getElementById('f-baidu').value.trim(),
      };
      if (!v.name) { toast('姓名不能为空'); return false; }
      if (id) v.createdAt = p.createdAt;
      try {
        if (id) await api(`/api/admin/persons/${id}`, { method: 'PUT', body: JSON.stringify(v) });
        else await api('/api/admin/persons', { method: 'POST', body: JSON.stringify(v) });
      } catch (e) { toast(e.message); return false; }
      toast('已保存');
      setTimeout(() => go('persons'), 60);
      return true;
    });
  }
  async function delPerson(id) {
    const p = (state.data.persons || []).find(x => x.id === id);
    if (!p) return;
    if (!confirm(`确认删除人物「${p.name}」？其关联作品不会被删除。`)) return;
    try {
      await api(`/api/admin/persons/${id}`, { method: 'DELETE' });
      toast('已删除');
      go('persons');
    } catch (e) { toast(e.message); }
  }

  /* ===== 作品 ===== */
  function renderWorks() {
    const works = get('works');
    const rows = works.map(w => {
      const st = STATUS[w.status] || ['已通过', 'tag-green'];
      return `<tr>
        <td><span class="t">${esc(w.title)}</span><span class="sub">${esc(w.netdiskType || '')} · ${esc(w.userName || w.userId || '')}</span></td>
        <td>${esc(personName(w.personId))}</td>
        <td><span class="sub">${esc(w.link || '-')}</span></td>
        <td><span class="tag ${st[1]}">${st[0]}</span></td>
        <td><span class="sub">${fmt(w.createdAt)}</span></td>
        <td><div class="cell-actions">
          ${w.status !== 'approved' ? `<button class="btn btn-sm btn-ok" onclick="Admin.setWorkStatus('${w.id}','approved')">通过</button>` : ''}
          ${w.status !== 'rejected' ? `<button class="btn btn-sm btn-ghost" onclick="Admin.setWorkStatus('${w.id}','rejected')">驳回</button>` : ''}
          <button class="btn btn-sm btn-ghost" onclick="Admin.editWork('${w.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="Admin.delWork('${w.id}')">删除</button>
        </div></td>
      </tr>`;
    }).join('');
    return `
      <div class="panel-head" style="border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;background:var(--panel)">
        <h2>共 ${works.length} 个作品</h2>
        <div class="actions"><button class="btn btn-sm btn-primary" onclick="Admin.editWork()">+ 新增作品</button></div>
      </div>
      <div class="panel"><div class="table-wrap">
        ${works.length ? `<table class="table">
          <thead><tr><th>作品 / 投稿人</th><th>所属人物</th><th>网盘链接</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>
          <tbody>${rows}</tbody></table>` : '<div class="empty">暂无作品投稿</div>'}
      </div></div>`;
  }
  function editWork(id) {
    const w = id ? get('works').find(x => x.id === id) : {};
    const persons = get('persons');
    const options = '<option value="">未关联</option>' + persons.map(p =>
      `<option value="${p.id}" ${p.id === w.personId ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
    const discs = (get('categories').netdiskTypes) || ['百度网盘','阿里云盘','夸克网盘'];
    openModal(id ? '编辑作品' : '新增作品', `
      <div class="field"><label>所属人物</label><select id="f-person">${options}</select></div>
      <div class="field"><label>作品标题 *</label><input class="input" id="f-title" value="${esc(w.title || '')}"></div>
      <div class="field"><label>网盘类型</label><input class="input" id="f-disk" value="${esc(w.netdiskType || discs[0])}"></div>
      <div class="field"><label>网盘链接</label><input class="input" id="f-link" value="${esc(w.link || '')}"></div>
      <div class="field"><label>提取码</label><input class="input" id="f-code" value="${esc(w.extractCode || '')}"></div>
      <div class="field"><label>封面 URL</label><input class="input" id="f-cover" value="${esc(w.cover || '')}"></div>
      <div class="field"><label>说明</label><textarea id="f-content" rows="3">${esc(w.content || '')}</textarea></div>`, async () => {
      const v = {
        personId: document.getElementById('f-person').value,
        title: document.getElementById('f-title').value.trim(),
        netdiskType: document.getElementById('f-disk').value.trim(),
        link: document.getElementById('f-link').value.trim(),
        extractCode: document.getElementById('f-code').value.trim(),
        cover: document.getElementById('f-cover').value.trim(),
        content: document.getElementById('f-content').value.trim(),
      };
      if (!v.title) { toast('标题不能为空'); return false; }

        v.status = w.status; v.userId = w.userId; v.userName = w.userName; v.createdAt = w.createdAt;
      } else {
        v.status = 'approved'; v.userId = 'admin'; v.userName = '管理员';
      }
      try {
        if (id) await api(`/api/admin/works/${id}`, { method: 'PUT', body: JSON.stringify(v) });
        else await api('/api/admin/works', { method: 'POST', body: JSON.stringify(v) });
      } catch (e) { toast(e.message); return false; }
      toast('已保存');
      setTimeout(() => go('works'), 60);
      return true;
    });
  }
  async function setWorkStatus(id, status) {
    try {
      await api(`/api/admin/works/${id}/status`, { method: 'POST', body: JSON.stringify({ status }) });
      toast('已更新');
      go('works');
    } catch (e) { toast(e.message); }
  }
  async function delWork(id) {
    if (!confirm('确认删除该作品？')) return;
    try {
      await api(`/api/admin/works/${id}`, { method: 'DELETE' });
      toast('已删除');
      go('works');

  let usersQuery = '';
  function renderUsers() {
    loadUsersPanel();
    return `
      <div class="panel" style="margin-bottom:18px" id="resetReqPanel">

      </div>

        <div class="panel-head">
          <h2>👥 全部用户</h2>
          <div class="actions">
            <input id="usersQuery" placeholder="搜索账号 / 昵称" value="${esc(usersQuery)}"
              style="background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:9px;font-size:12.5px;width:200px"
              oninput="Admin.searchUsers(this.value)">

        </div>
        <div id="usersTableWrap"><div class="empty">加载中…</div></div>

  async function loadUsersPanel() {
    try {
      const r = await api('/api/admin/users');
      usersData = r;
      drawResetReqs(r.pendingRequests || []);
      drawUsersTable();
    } catch (e) {
      toast(e.message || '加载失败');

  let usersData = { users: [], pendingRequests: [] };
  function drawResetReqs(list) {
    const el = document.getElementById('resetReqPanel');
    if (!el) return;
    if (!list.length) {
      el.innerHTML = `<div class="panel-head"><h2>📮 重置密码申请</h2></div><div class="empty">暂无待处理申请</div>`;
      return;
    }
    el.innerHTML = `
      <div class="panel-head"><h2>📮 重置密码申请 <span class="tag tag-amber">${list.length} 条待处理</span></h2></div>
      <table class="table">
        <thead><tr><th>账号</th><th>昵称</th><th>申请时间</th><th>操作</th></tr></thead>
        <tbody>${list.map(q => `<tr>
          <td><b>${esc(q.username)}</b></td>
          <td>${esc(q.nickname)}</td>
          <td>${fmt(q.createdAt)}</td>

  function adjustPoints(userId, dir) {
    const p = pointsOf(userId);
    openModal(dir > 0 ? '发放积分' : '扣减积分', `
      <div class="field"><label>用户 ID</label><input class="input" value="${esc(userId)}" disabled></div>

      <div class="field"><label>备注</label><input class="input" id="f-remark" value="${dir > 0 ? '管理员发放' : '管理员扣减'}"></div>`, async () => {

      if (dir < 0 && amount > p.available) { toast('扣减数量不能超过可用积分'); return false; }
      try {
        await api(`/api/admin/users/${userId}/points`, { method: 'POST', body: JSON.stringify({ delta: dir * amount, remark }) });

      toast('操作成功');

  // 正文格式化：选中文字包裹标签
  function wrapSel(id, before, after, placeholder) {
    const ta = document.getElementById(id);
    if (!ta) return;
    const s = ta.selectionStart, e = ta.selectionEnd;
    const sel = ta.value.slice(s, e) || placeholder || '';
    ta.value = ta.value.slice(0, s) + before + sel + after + ta.value.slice(e);
    ta.focus();
    ta.selectionStart = s + before.length;
    ta.selectionEnd = s + before.length + sel.length;
  }
  function fmtLink(id) {
    const ta = document.getElementById(id);
    if (!ta) return;
    const url = prompt('请输入链接地址（https:// 开头）');
    if (!url) return;
    wrapSel(id, `<a href="${url}" target="_blank" rel="noopener">`, '</a>', '链接文字');
  }
  // 投稿帖一键转为推荐文章（预填网盘信息并关联原帖）
  function postToArticle(id) {
    const p = (state.data.posts || []).find(x => x.id === id);
    if (!p) { toast('帖子不存在'); return; }
    const excerpt = String(p.content || '').replace(/<[^>]+>/g, '').trim().slice(0, 80);
    editArticle(null, {
      title: p.title,
      cover: p.cover || '',
      excerpt,
      content: `<p>${esc(String(p.content || '').replace(/<[^>]+>/g, '').trim()).replace(/\n/g, '<br>')}</p>`,
      driveType: p.netdiskType || '',
      driveLink: p.link || '',
      driveCode: p.extractCode || '',
      drivePoint: 0,
      relatedPostId: p.id,
    });
  }
  // 关联帖子后，积分解锁改为不可填（解锁在帖子内完成）
  function syncRelatedDrive(postId) {
    const inp = document.getElementById('f-drive-point');
    const hint = document.getElementById('f-drive-point-hint');
    if (!inp) return;
    const linked = !!postId;
    if (linked) inp.value = 0;
    inp.disabled = linked;
    inp.style.opacity = linked ? '0.55' : '1';
    inp.style.cursor = linked ? 'not-allowed' : '';
    if (hint) hint.style.display = linked ? '' : 'none';
  }

      <div class="panel" style="margin-bottom:18px">
        <div class="panel-head"><h2>分类配置</h2><div class="actions">
          <button class="btn btn-sm btn-primary" onclick="Admin.saveCategories()">保存配置</button></div></div>
        <div class="panel-body" style="padding:18px">
          <div class="field"><label>资源类型（逗号分隔）</label><textarea id="c-res" rows="2">${esc(join(c.resourceTypes))}</textarea></div>
          <div class="field"><label>网盘类型（逗号分隔）</label><textarea id="c-disk" rows="2">${esc(join(c.netdiskTypes))}</textarea></div>
          <div class="field"><label>人物标签（逗号分隔）</label><textarea id="c-tags" rows="2">${esc(join(c.personTags))}</textarea></div>
          <div class="hint">支持中文逗号或英文逗号分隔；保存后前台投稿与筛选选项会同步更新。</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>🖼️ 站点设置 · 默认缩略图</h2><div class="actions">
          <button class="btn btn-sm btn-primary" onclick="Admin.saveSettings()">保存设置</button></div></div>
        <div class="panel-body" style="padding:18px">
          <div class="field">
            <label>论坛列表默认缩略图（图片直链）</label>
            <input class="input" id="s-default-thumb" value="${esc(thumb)}" placeholder="${esc(fallbackThumb)}"
              oninput="var p=document.getElementById('s-thumb-preview');if(p)p.src=this.value.trim()||'${esc(fallbackThumb)}'">
            <div class="hint">网友投稿未填缩略图时，论坛列表左侧展示此图；留空保存则恢复系统默认图。</div>
          </div>
          <div style="display:flex;align-items:center;gap:14px;margin-top:6px">
            <img id="s-thumb-preview" src="${esc(thumb)}" alt="默认缩略图预览"
              style="width:108px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--panel-2)">
            <div class="hint" style="margin:0">预览（108×80 裁切效果）<br>可前往 <a href="https://img.scdn.io/" target="_blank" rel="noopener" style="color:var(--primary-2)">img.scdn.io</a> 上传后复制链接</div>
          </div>
        </div>
      </div>`;
  }
  async function saveSettings() {
    const v = document.getElementById('s-default-thumb').value.trim();
    if (v && !/^https?:\/\//i.test(v)) { toast('请填写 http/https 图片直链'); return; }
    try {
      await api('/api/admin/settings', { method: 'PUT', body: JSON.stringify({ defaultThumb: v }) });
    } catch (e) { toast(e.message); return; }
    toast('站点设置已保存');
    go('categories');
  }
  async function saveCategories() {
    const split = v => v.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    const categories = {
      resourceTypes: split(document.getElementById('c-res').value),
      netdiskTypes: split(document.getElementById('c-disk').value),
      personTags: split(document.getElementById('c-tags').value),
    };
    try {
      await api('/api/admin/categories', { method: 'PUT', body: JSON.stringify(categories) });
    } catch (e) { toast(e.message); return; }
    toast('分类已更新');
    go('categories');
  }

  /* ===== 备份 ===== */
  function renderBackup() {
    const d = state.data;
    const rows = [
      ['users', d.users], ['posts', d.posts], ['persons', d.persons], ['works', d.works],
      ['articles', d.articles], ['banner', d.banner], ['pointLogs', d.logs],
    ];
    return `
      <div class="notice">数据存储于服务器 SQLite 数据库（<b>/opt/vision-she/data/vision.db</b>）。此处可导出当前数据快照为 JSON 留档；请在服务器上直接复制该数据库文件进行完整备份。</div>
      <div class="panel" style="margin-bottom:18px">
        <div class="panel-head"><h2>数据快照</h2><div class="actions">
          <button class="btn btn-sm btn-primary" onclick="Admin.exportData()">导出 JSON</button>
          <button class="btn btn-sm btn-ghost" onclick="Admin.go('backup')">刷新数据</button>
        </div></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>数据表</th><th>记录数</th><th>说明</th></tr></thead>
          <tbody>${rows.map(([k, v]) => `<tr>
            <td>${k}</td><td>${Array.isArray(v) ? v.length : 0}</td><td>${k === 'pointLogs' ? '最近100条流水' : '全部记录'}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`;
  }
  function exportData() {
    const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `vision-she-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已导出');
  }

  /* ===== 弹窗 ===== */
  function openModal(title, bodyHtml, onOk) {
    closeModal();
    const mask = document.createElement('div');
    mask.className = 'mask';
    mask.id = 'mask';
    mask.innerHTML = `
      <div class="modal">
        <h3>${title}</h3>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="md-cancel">取消</button>
          <button class="btn btn-primary" id="md-ok">确定</button>
        </div>
      </div>`;
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
    document.getElementById('md-cancel').onclick = closeModal;
    document.getElementById('md-ok').onclick = async () => {
      const r = onOk();
      if (r && typeof r.then === 'function') {
        if ((await r) !== false) closeModal();
      } else if (r !== false) {
        closeModal();
      }
    };
  }
  function closeModal() {
    const m = document.getElementById('mask');
    if (m) m.remove();
  }

  async function boot() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) {
      try {
        const me = await api('/api/auth/me');
        if (me.user && me.user.role === 'admin') {
          adminUser = me.user;
          await go('overview');
          return;
        }
      } catch { localStorage.removeItem(TOKEN_KEY); }
    }
    renderLogin();
  }

  return {
    go, logout, boot, openModal, closeModal, toggleTheme,
    setPostTab: k => { state.postTab = k; go('posts'); },
    setCommentTab, handleMention, delPostComment,
    setStatus, delPost, finishDemand, refundDemand,
    editPerson, delPerson,
    editWork, setWorkStatus, delWork,
    searchPoints, adjustPoints,
    searchUsers, adminResetPwd, rejectReset,
    editArticle, postToArticle, delArticle, syncRelatedDrive, wrapSel, fmtLink, delComment,
    editBanner, delBanner,
    saveCategories, saveSettings,
    exportData,
  };
})();
window.Admin = Admin;
Admin.boot();
</script>
</body>
</html>
