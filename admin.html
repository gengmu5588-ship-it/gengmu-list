<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>视觉社 - 管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-dark: #121212;
      --color-card: #1e1e1e;
      --color-card-hover: #252525;
      --color-primary: #7C3AED;
      --color-primary-hover: #8B5CF6;
      --color-text: #e5e7eb;
      --color-text-muted: #9ca3af;
      --color-border: #374151;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--color-dark);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }

    .animate-slide-up {
      animation: slideUp 0.5s ease-out forwards;
    }

    .navbar {
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--color-border);
      padding: 1rem;
    }

    .navbar-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1rem;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .navbar-logo {
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(135deg, var(--color-primary), #a78bfa);
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .navbar-title {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--color-primary), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn {
      background: linear-gradient(135deg, var(--color-primary), #6d28d9);
      color: white;
      padding: 0.625rem 1.25rem;
      border-radius: 0.5rem;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--color-primary-hover), #7c3aed);
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: rgba(55, 65, 81, 0.5);
    }

    .btn-secondary:hover {
      background: rgba(75, 85, 99, 0.7);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .input-field {
      background: rgba(10, 10, 10, 0.5);
      color: white;
      border: 1px solid var(--color-border);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      width: 100%;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      transition: all 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    .input-field::placeholder {
      color: #6b7280;
    }

    textarea.input-field {
      min-height: 120px;
      resize: vertical;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem;
    }

    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: rgba(30, 30, 30, 0.5);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
      border: 1px solid var(--color-border);
      transition: all 0.3s ease;
    }

    .admin-item:hover {
      background: rgba(30, 30, 30, 0.8);
      border-color: var(--color-primary);
    }

    .admin-item-info {
      flex: 1;
    }

    .admin-item-title {
      font-weight: 500;
      color: var(--color-text);
    }

    .admin-item-price {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--color-text-muted);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 1rem;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background: var(--color-card);
      border-radius: 1rem;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      transform: scale(0.9) translateY(20px);
      transition: all 0.3s ease;
      border: 1px solid var(--color-border);
    }

    .modal-overlay.show .modal-content {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      background: linear-gradient(135deg, #1677ff, #0056d6);
      padding: 1.25rem;
      text-align: center;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      width: 1.75rem;
      height: 1.75rem;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: background 0.2s ease;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .modal-header h3 {
      color: white;
      font-size: 1.125rem;
      font-weight: 600;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--color-border);
    }

    /* 收款配置样式 */
    .payment-config {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .payment-option {
      flex: 1;
      padding: 1rem;
      border: 2px solid var(--color-border);
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .payment-option:hover {
      border-color: var(--color-primary);
    }

    .payment-option.active {
      border-color: var(--color-primary);
      background: rgba(124, 58, 237, 0.1);
    }

    .payment-option i {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .payment-option.alipay i {
      color: #1677ff;
    }

    .payment-option.wechat i {
      color: #10b981;
    }

    .payment-option span {
      font-size: 0.875rem;
      color: var(--color-text);
    }

    /* 聊天消息样式 */
    .chat-container {
      height: 400px;
      overflow-y: auto;
      padding: 1rem;
      background: rgba(10, 10, 10, 0.5);
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      -webkit-overflow-scrolling: touch;
    }

    .chat-message {
      margin-bottom: 1rem;
      display: flex;
    }

    .chat-message.self {
      justify-content: flex-end;
    }

    .chat-message.other {
      justify-content: flex-start;
    }

    .chat-bubble {
      max-width: 15ch;
      min-width: fit-content;
      width: fit-content;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      word-break: break-all;
      white-space: pre-wrap;
    }

    .chat-message.self .chat-bubble {
      background: var(--color-primary);
      color: white;
      border-bottom-right-radius: 0.25rem;
    }

    .chat-message.other .chat-bubble {
      background: var(--color-card);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-bottom-left-radius: 0.25rem;
    }

    .chat-timestamp {
      font-size: 0.625rem;
      color: var(--color-text-muted);
      margin-top: 0.25rem;
      text-align: right;
    }

    .chat-input-container {
      display: flex;
      gap: 0.5rem;
    }

    .chat-input {
      flex: 1;
      background: rgba(10, 10, 10, 0.5);
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: white;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    /* 用户订单样式 */
    .order-item {
      background: rgba(30, 30, 30, 0.5);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border: 1px solid var(--color-border);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .order-id {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .order-status {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
    }

    .order-status.completed {
      background: rgba(34, 197, 94, 0.2);
      color: #10b981;
    }

    .order-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-product {
      font-weight: 500;
      color: var(--color-text);
    }

    .order-price {
      color: var(--color-primary);
      font-weight: 600;
    }

    /* 表单卡片样式 */
    .form-card {
      background: var(--color-card);
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid var(--color-border);
    }

    /* 图片上传区域样式 */
    .upload-area {
      border: 2px dashed var(--color-border);
      border-radius: 0.75rem;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    .upload-area:hover {
      border-color: var(--color-primary);
      background: rgba(124, 58, 237, 0.05);
    }

    .upload-area.dragover {
      border-color: var(--color-primary);
      background: rgba(124, 58, 237, 0.1);
    }

    .editor-btn {
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid transparent;
      border-radius: 0.25rem;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .editor-btn:hover {
      background: rgba(124, 58, 237, 0.2);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .upload-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-top: 1rem;
    }

    @media (min-width: 640px) {
      .upload-preview {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid var(--color-border);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-item .remove-btn {
      position: absolute;
      top: 0.25rem;
      right: 0.25rem;
      width: 1.5rem;
      height: 1.5rem;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .preview-item:hover .remove-btn {
      opacity: 1;
    }

    .preview-item .remove-btn:hover {
      background: rgba(239, 68, 68, 1);
    }

    /* 私信列表样式 */
    .message-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .message-item {
      padding: 0.75rem;
      background: rgba(10, 10, 10, 0.5);
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .message-item:hover {
      background: rgba(124, 58, 237, 0.1);
      border-color: var(--color-primary);
    }

    .message-item.active {
      background: rgba(124, 58, 237, 0.15);
      border-color: var(--color-primary);
    }

    .message-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }

    .message-item-name {
      font-weight: 500;
      color: white;
    }

    .message-item-time {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .message-item-preview {
      font-size: 0.875rem;
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 链接状态样式 */
    .link-status {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
    }

    .link-status.normal {
      background: rgba(34, 197, 94, 0.2);
      color: #10b981;
    }

    .link-status.invalid {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .link-status.cancelled {
      background: rgba(251, 146, 60, 0.2);
      color: #fb923c;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.75rem 0;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      accent-color: var(--color-primary);
      width: 1rem;
      height: 1rem;
    }

    .remember-me span {
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }

    .admin-table {
      width: 100%;
    }

    .admin-table-header {
      display: grid;
      grid-template-columns: 3rem 1fr 5rem 7rem;
      gap: 0.75rem;
      padding: 0.75rem;
      background: rgba(10, 10, 10, 0.5);
      border-radius: 0.5rem 0.5rem 0 0;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .admin-table-row {
      display: grid;
      grid-template-columns: 3rem 1fr 5rem 7rem;
      gap: 0.75rem;
      padding: 0.75rem;
      border-bottom: 1px solid var(--color-border);
      align-items: center;
    }

    .form-control {
      width: 100%;
      background: rgba(10, 10, 10, 0.5);
      color: white;
      border: 1px solid var(--color-border);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      resize: vertical;
      margin-bottom: 0.5rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .banner-upload-area {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .banner-upload-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.25rem;
      height: 1.25rem;
      padding: 0 0.375rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      line-height: 1;
      margin-left: 0.375rem;
    }

    .badge-red {
      background: #ef4444;
      color: white;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .tab-btn {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text-muted);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      white-space: nowrap;
    }

    .tab-btn:hover {
      background: rgba(124, 58, 237, 0.1);
      border-color: var(--color-primary);
      color: var(--color-text);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--color-primary), #6d28d9);
      border-color: transparent;
      color: white;
    }

    .review-avatar {
      width: 2rem;
      height: 2rem;
      min-width: 2rem;
      min-height: 2rem;
      max-width: 2rem;
      max-height: 2rem;
      border-radius: 50%;
      background: var(--color-card-hover);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .review-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .review-avatar i {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .card {
      background: var(--color-card);
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    /* 分类管理样式 */
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .category-item-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem;
      background: rgba(10, 10, 10, 0.5);
      border-radius: 0.5rem;
    }

    .category-item-row input {
      flex: 1;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 0.375rem;
      padding: 0.5rem;
      color: white;
    }

    .category-item-row input:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .category-item-row button {
      padding: 0.5rem;
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 0.375rem;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-item-row button:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
    }

    /* 排序按钮 */
    .sort-btn {
      background: transparent;
      border: 1px solid var(--color-border);
      border-radius: 0.375rem;
      padding: 0.375rem;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sort-btn:hover {
      background: rgba(124, 58, 237, 0.1);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .hidden {
      display: none !important;
    }

    /* ==========================================
       移动端响应式适配
       ========================================== */
    @media (max-width: 640px) {
      .btn-hide-mobile {
        display: none !important;
      }

      .btn-text {
        display: none;
      }

      .navbar {
        padding: 0.75rem;
      }

      .navbar-content {
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0 0.75rem;
      }

      .navbar-brand {
        flex: 1;
        min-width: 0;
      }

      .navbar-logo {
        width: 2rem;
        height: 2rem;
      }

      .navbar-title {
        font-size: 1.125rem;
      }

      .navbar-content > div:last-child,
      .navbar-content > .btn {
        flex-shrink: 0;
      }

      .btn {
        padding: 0.5rem 0.75rem;
        font-size: 0.8125rem;
      }

      .btn .fa-arrow-left {
        margin-right: 0;
      }

      .container {
        padding: 0.75rem;
      }

      .modal-content {
        max-width: 100%;
        margin: 0.5rem;
        border-radius: 0.75rem;
      }

      .modal-overlay {
        padding: 0.5rem;
      }

      .modal-header {
        padding: 1rem;
      }

      .modal-body {
        padding: 1rem;
        max-height: 70vh;
        overflow-y: auto;
      }

      .modal-footer {
        padding: 0.75rem 1rem;
      }

      .chat-container {
        height: calc(100vh - 200px);
      }

      .chat-bubble {
        max-width: 12ch;
        font-size: 0.8125rem;
        padding: 0.625rem 0.875rem;
      }

      .chat-input-container {
        padding: 0.75rem;
      }

      .form-card {

      <p style="color:var(--color-text-muted);font-size:0.875rem;">正在加载数据...</p>
    </div>
  </div>

<script>
// ==========================================
// 数据存储 - GitHub API 云端同步
// ==========================================
const CLOUD = {
  token: (typeof localStorage !== 'undefined' && localStorage.getItem('gh_token')) || '',
  repo: 'gengmu5588-ship-it/gengmu-list',
  branch: 'main',
  file: 'data.json',
  get rawUrl() { return `https://raw.githubusercontent.com/${this.repo}/${this.branch}/${this.file}`; },
  get apiUrl() { return `https://api.github.com/repos/${this.repo}/contents/${this.file}`; }
};

let _cloudSha = null;
let _cloudSyncing = false;
let _cloudReady = false;
let _cloudSaveTimer = null;

const DATA_KEYS = ['albums', 'categories', 'orders', 'reviews', 'favorites', 'messages', 'heroConfig', 'users', 'paymentConfig', 'adminConfig', 'memberConfig', 'backgroundConfig'];
const SHARED_KEYS = ['albums', 'categories', 'messages', 'heroConfig', 'paymentConfig', 'adminConfig', 'memberConfig', 'backgroundConfig'];

function getDB(k) { return JSON.parse(localStorage.getItem(k) || '[]') }
function setDB(k, v) {
  localStorage.setItem(k, JSON.stringify(v));
  if (_cloudReady && isAdmin()) {
    clearTimeout(_cloudSaveTimer);
    _cloudSaveTimer = setTimeout(cloudSave, 2000);
  }
}
function isAdmin() { return localStorage.getItem('admin') === 'ok' }

function getCurrentUser() {
  const userData = localStorage.getItem('user');
  return userData ? JSON.parse(userData) : null;
}

function isUserMember(user) {
  return user && user.memberExpire && user.memberExpire > Date.now();
}

function getMemberFreeLeft(user) {
  if (!isUserMember(user)) return 0;
  const memberConfig = getDB('memberConfig')[0] || { freeCount: 3 };
  return Math.max(0, (memberConfig.freeCount || 3) - (user.memberFreeUsed || 0));
}

async function cloudInit() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(CLOUD.rawUrl + '?t=' + Date.now(), { signal: controller.signal });
    clearTimeout(timeout);
    if (res.ok) {
      const data = await res.json();
      const currentUser = getCurrentUser();
      SHARED_KEYS.forEach(key => {
        if (data[key] !== undefined) {
          const cloudVal = data[key];
          if (Array.isArray(cloudVal) && cloudVal.length === 0) {
            const localVal = localStorage.getItem(key);
            if (localVal) {
              const parsed = JSON.parse(localVal);
              if (Array.isArray(parsed) && parsed.length > 0) return;
            }
          }
          localStorage.setItem(key, JSON.stringify(cloudVal));
        }
      });
      if (data.users) {
        const currentUser = getCurrentUser();
        const cloudUsers = data.users;
        if (currentUser) {
          const existsInCloud = cloudUsers.find(u => u.id === currentUser.id);
          if (!existsInCloud) {
            cloudUsers.push(currentUser);
          } else {
            Object.assign(existsInCloud, { ...currentUser, ...existsInCloud });
          }
        }
        localStorage.setItem('users', JSON.stringify(cloudUsers));
      }
      if (data.orders) {
        const localOrders = getDB('orders');
        const cloudOrders = data.orders;
        if (currentUser) {
          const myLocalOrders = localOrders.filter(o => o.userId === currentUser.id);
          const otherCloudOrders = cloudOrders.filter(o => o.userId !== currentUser.id);
          localStorage.setItem('orders', JSON.stringify([...otherCloudOrders, ...myLocalOrders]));
        } else {
          localStorage.setItem('orders', JSON.stringify(cloudOrders));
        }
      }
      if (data.reviews) {
        const localReviews = getDB('reviews');
        const cloudReviews = data.reviews;
        if (currentUser) {
          const myLocalReviews = localReviews.filter(r => r.userId === currentUser.id);
          const otherCloudReviews = cloudReviews.filter(r => r.userId !== currentUser.id);
          localStorage.setItem('reviews', JSON.stringify([...otherCloudReviews, ...myLocalReviews]));
        } else {
          localStorage.setItem('reviews', JSON.stringify(cloudReviews));
        }
      }
      if (data.favorites) {
        const localFavorites = getDB('favorites');
        const cloudFavorites = data.favorites;
        if (currentUser) {
          const myLocalFav = localFavorites.filter(f => f.userId === currentUser.id);
          const otherCloudFav = cloudFavorites.filter(f => f.userId !== currentUser.id);
          localStorage.setItem('favorites', JSON.stringify([...otherCloudFav, ...myLocalFav]));
        } else {
          localStorage.setItem('favorites', JSON.stringify(cloudFavorites));
        }
      }
      _cloudReady = true;
    } else if (res.status === 404) {
      _cloudReady = true;
      if (isAdmin()) {
        const hasLocalData = DATA_KEYS.some(key => {
          const val = localStorage.getItem(key);
          return val && JSON.parse(val).length > 0;
        });
        if (hasLocalData) {
          setTimeout(cloudSave, 1000);
        }
      }
    }
  } catch (e) {
    console.warn('云端数据加载失败，使用本地缓存:', e);
    _cloudReady = true;
  }
}

async function cloudSave() {
  if (_cloudSyncing || !isAdmin()) return;
  _cloudSyncing = true;
  updateSyncStatus('syncing');

  try {
    const data = {};
    DATA_KEYS.forEach(key => {
      const val = localStorage.getItem(key);
      if (val) data[key] = JSON.parse(val);
    });

    const jsonStr = JSON.stringify(data);
    if (jsonStr.length > 25 * 1024 * 1024) {
      console.error('数据过大，无法同步到云端');
      updateSyncStatus('error');
      _cloudSyncing = false;
      return;
    }

    const content = btoa(unescape(encodeURIComponent(jsonStr)));
    const headers = {
      'Authorization': `token ${CLOUD.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };

    if (!_cloudSha) {
      try {
        const info = await fetch(CLOUD.apiUrl, { headers });
        if (info.ok) _cloudSha = (await info.json()).sha;
      } catch (e) {}
    }

    const body = { message: `data sync: ${new Date().toISOString()}`, content, branch: CLOUD.branch };
    if (_cloudSha) body.sha = _cloudSha;

    const res = await fetch(CLOUD.apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (res.ok) {
      const result = await res.json();
      _cloudSha = result.content.sha;
      updateSyncStatus('synced');
    } else {
      const err = await res.json().catch(() => ({}));
      if (err.message && err.message.includes('SHA')) {
        try {
          const info = await fetch(CLOUD.apiUrl, { headers });
          if (info.ok) {
            _cloudSha = (await info.json()).sha;
            body.sha = _cloudSha;
            const retry = await fetch(CLOUD.apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
            if (retry.ok) {
              _cloudSha = (await retry.json()).content.sha;
              updateSyncStatus('synced');
            } else {
              updateSyncStatus('error');
            }
          }
        } catch (e) { updateSyncStatus('error'); }
      } else {
        updateSyncStatus('error');
      }
    }
  } catch (e) {
    console.error('云端保存失败:', e);
    updateSyncStatus('error');
  }

  _cloudSyncing = false;
}

async function forceCloudSync() {
  if (!isAdmin()) return;
  updateSyncStatus('syncing');
  await cloudSave();
}

function updateSyncStatus(status) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  if (status === 'syncing') {
    el.innerHTML = '<i class="fas fa-sync fa-spin" style="color:var(--color-warning);"></i><span class="btn-text">同步中</span>';
  } else if (status === 'synced') {
    el.innerHTML = '<i class="fas fa-cloud" style="color:var(--color-primary);"></i><span class="btn-text">已同步</span>';
  } else {
    el.innerHTML = '<i class="fas fa-exclamation-circle" style="color:var(--color-danger);"></i><span class="btn-text">同步失败</span>';
  }
}

let selectedPaymentType = 'alipay';

function login() {
  const u = document.getElementById('user').value;
  const p = document.getElementById('pwd').value;
  const rememberMe = document.getElementById('rememberMe')?.checked || false;
  
  const admins = getAdmins();
  const matchedAdmin = admins.find(a => a.username === u && a.password === p);
  
  if (matchedAdmin) {
    localStorage.setItem('admin', 'ok');
    localStorage.setItem('adminRemember', rememberMe ? 'true' : 'false');
    localStorage.setItem('currentAdminId', matchedAdmin.id);
    renderAdmin(document.getElementById('root'));
  } else {
    alert('账号或密码错误');
  }
}

function logout() {
  localStorage.removeItem('admin');
  localStorage.removeItem('adminId');
  localStorage.removeItem('currentAdminId');
  renderLogin(document.getElementById('root'));
}

// 修改管理员密码
function changeAdminPassword() {
  const oldPwd = document.getElementById('oldPwd').value;
  const newPwd = document.getElementById('newPwd').value;
  const confirmPwd = document.getElementById('confirmPwd').value;
  
  if (!oldPwd || !newPwd || !confirmPwd) {
    alert('请填写完整信息');
    return;
  }
  
  if (newPwd !== confirmPwd) {
    alert('两次输入的新密码不一致');
    return;
  }
  
  if (newPwd.length < 6) {
    alert('密码长度不能少于6位');
    return;
  }
  
  const admins = getAdmins();
  const currentAdminId = localStorage.getItem('currentAdminId') || '1';
  const currentAdmin = admins.find(a => a.id === currentAdminId);
  
  if (!currentAdmin || oldPwd !== currentAdmin.password) {
    alert('原密码错误');
    return;
  }
  
  currentAdmin.password = newPwd;
  saveAdmins(admins);
  
  alert('密码修改成功，请重新登录');
  logout();
}

function confirmAddAdmin() {

  if (!username || !password) {

  }
  if (password.length < 6) {

function confirmEditAdmin(adminId) {
  const username = document.getElementById('editAdminUser').value.trim();
  const password = document.getElementById('editAdminPwd').value;
  const confirmPwd = document.getElementById('editAdminPwdConfirm').value;
  
  if (!username) {
    alert('账号不能为空');
    return;
  }
  if (password && password.length < 6) {
    alert('密码长度不能少于6位');
    return;
  }
  if (password && password !== confirmPwd) {
    alert('两次密码不一致');
    return;
  }
  
  const admins = getAdmins();
  if (admins.some(a => a.username === username && a.id !== adminId)) {
    alert('该账号已存在');
    return;
  }
  
  const admin = admins.find(a => a.id === adminId);
  if (!admin) return;
  
  admin.username = username;
  if (password) admin.password = password;
  saveAdmins(admins);
  
  document.querySelector('.modal-overlay.show')?.remove();
  renderAdminAccounts();
  alert('管理员信息修改成功');

function deleteAdminAccount(adminId) {
  const admins = getAdmins();
  if (admins.length <= 1) {
    alert('至少保留一个管理员账号');
    return;
  }
  
  const admin = admins.find(a => a.id === adminId);
  if (!confirm(`确定删除管理员「${admin.username}」吗？`)) return;
  
  const updated = admins.filter(a => a.id !== adminId);
  saveAdmins(updated);
  
  if (localStorage.getItem('currentAdminId') === adminId) {
    alert('当前登录的管理员已删除，请重新登录');
    logout();
    return;
  }
  
  renderAdminAccounts();
}

function getConversations() {
  const messages = getDB('messages');
  const users = getDB('users');
  const conversations = [];
  const userIds = new Set();
  
  messages.forEach(m => {
    if (!m.isAdmin && m.userId) {
      userIds.add(m.userId);
    }
  });
  
  userIds.forEach(userId => {
    const userMessages = messages.filter(m => m.userId === userId || (m.isAdmin && m.targetUserId === userId));
    const lastMessage = userMessages.sort((a, b) => b.time - a.time)[0];
    const user = users.find(u => u.id === userId);
    
    let displayName;
    if (userId === 'guest') {
      const guestMsgs = messages.filter(m => m.userId === 'guest' && m.username);
      displayName = guestMsgs.length > 0 ? guestMsgs[guestMsgs.length - 1].username : '游客';
    } else {
      displayName = user?.username || '未知用户';
    }
    
    conversations.push({
      userId,
      username: displayName,
      lastMessage: lastMessage?.content || '',
      lastTime: lastMessage?.time || 0
    });
  });
  
  return conversations.sort((a, b) => b.lastTime - a.lastTime);
}

// ==========================================
// 图片压缩与上传
// ==========================================
function compressImage(file, maxWidth = 600, maxHeight = 600, quality = 0.6) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;
      
      if (width > maxWidth) {
        height = (height * maxWidth) / width;
        width = maxWidth;
      }
      if (height > maxHeight) {
        width = (width * maxHeight) / height;
        height = maxHeight;
      }
      
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      
      const compressedDataUrl = canvas.toDataURL(file.type, quality);
      resolve(compressedDataUrl);
    };
    img.onerror = () => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(file);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function uploadImageToGitHub(file, compressedDataUrl) {
  if (!isAdmin()) return compressedDataUrl;
  
  try {
    const timestamp = Date.now();
    const randomStr = Math.random().toString(36).substring(2, 8);
    const ext = file.name.split('.').pop() || 'jpg';
    const fileName = `images/${timestamp}_${randomStr}.${ext}`;
    const apiUrl = `https://api.github.com/repos/${CLOUD.repo}/contents/${fileName}`;
    
    const base64Content = compressedDataUrl.split(',')[1];
    
    const headers = {
      'Authorization': `token ${CLOUD.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };
    
    const body = {
      message: `upload image: ${fileName}`,
      content: base64Content,
      branch: CLOUD.branch
    };
    
    const res = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (res.ok) {
      const imageUrl = `https://raw.githubusercontent.com/${CLOUD.repo}/${CLOUD.branch}/${fileName}`;
      return imageUrl;
    } else {
      console.warn('GitHub图片上传失败，使用Base64降级');
      return compressedDataUrl;
    }
  } catch (e) {
    console.warn('GitHub图片上传异常，使用Base64降级:', e);
    return compressedDataUrl;
  }
}

function isImageUrl(src) {
  return src && (src.startsWith('http://') || src.startsWith('https://'));

async function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;

      const finalSrc = await uploadImageToGitHub(file, compressedData);
      uploadedImages.push(finalSrc);

function initDragUpload() {
  const uploadArea = document.getElementById('uploadArea');
  if (!uploadArea) return;
  
  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });
  
  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });
  
  uploadArea.addEventListener('drop', async (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    
    const files = Array.from(e.dataTransfer.files);
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      
      try {
        const compressedData = await compressImage(file);
        const finalSrc = await uploadImageToGitHub(file, compressedData);
        uploadedImages.push(finalSrc);
        renderPreview();
      } catch (error) {
        console.error('图片处理失败:', error);
        alert('图片处理失败，请重试');
      }
    }
  });
}

function compressExistingBase64(dataUrl, maxWidth, maxHeight, quality) {
  return new Promise(resolve => {
    if (!dataUrl || !dataUrl.startsWith('data:image')) { resolve(dataUrl); return; }
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
      if (h > maxHeight) { w = (w * maxHeight) / h; h = maxHeight; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function cleanupStorageQuota() {
  try {
    const heroConfig = getDB('heroConfig')[0];
    if (heroConfig) {
      let changed = false;
      if (heroConfig.logo) {
        const compressed = await compressExistingBase64(heroConfig.logo, 200, 200, 0.7);
        if (compressed !== heroConfig.logo) { heroConfig.logo = compressed; changed = true; }
      }
      if (heroConfig.image) {
        const compressed = await compressExistingBase64(heroConfig.image, 1200, 400, 0.7);
        if (compressed !== heroConfig.image) { heroConfig.image = compressed; changed = true; }
      }
      if (heroConfig.heroImages && heroConfig.heroImages.length) {
        for (let i = 0; i < heroConfig.heroImages.length; i++) {
          const compressed = await compressExistingBase64(heroConfig.heroImages[i], 1200, 400, 0.7);
          if (compressed !== heroConfig.heroImages[i]) { heroConfig.heroImages[i] = compressed; changed = true; }
        }
      }
      if (changed) {
        setDB('heroConfig', [heroConfig]);
        console.log('已自动压缩首页装扮图片数据');
      }
    }
    const paymentConfig = getDB('paymentConfig')[0];
    if (paymentConfig && paymentConfig.qrCode) {
      const compressed = await compressExistingBase64(paymentConfig.qrCode, 300, 300, 0.7);
      if (compressed !== paymentConfig.qrCode) {
        paymentConfig.qrCode = compressed;
        setDB('paymentConfig', [paymentConfig]);
        console.log('已自动压缩收款码图片数据');
      }
    }
  } catch(e) {
    console.warn('清理存储空间时出错:', e);
  }
}

  if (!newName || !newName.trim()) return;
  
  const categories = getDB('categories');
  const index = categories.findIndex(c => c.id === categoryId);
  
  if (index === -1) return;
  
  const exists = categories.find(c => c.id !== categoryId && c.name === newName.trim());
  if (exists) {

  if (!confirm('确定删除此分类？')) return;
  
  const categories = getDB('categories').filter(c => c.id !== categoryId);
  categories.forEach((c, index) => {
    c.sort = index;
  });
  setDB('categories', categories);
  
  const albums = getDB('albums');
  albums.forEach(a => {
    if (a.categoryId === categoryId) {
      a.categoryId = '';
    }
  });
  setDB('albums', albums);
  
  renderPage();
}

function moveCategoryUp(categoryId) {
  const categories = getDB('categories');
  const index = categories.findIndex(c => c.id === categoryId);
  
  if (index <= 0) return;
  
  const temp = categories[index];
  categories[index] = categories[index - 1];
  categories[index - 1] = temp;
  
  categories.forEach((c, i) => {
    c.sort = i;
  });
  
  setDB('categories', categories);
  renderPage();
}

function moveCategoryDown(categoryId) {
  const categories = getDB('categories');
  const index = categories.findIndex(c => c.id === categoryId);
  
  if (index >= categories.length - 1) return;
  
  const temp = categories[index];
  categories[index] = categories[index + 1];
  categories[index + 1] = temp;
  
  categories.forEach((c, i) => {
    c.sort = i;
  });
  
  setDB('categories', categories);
  renderPage();
}

function copyLink(url, button) {
  navigator.clipboard.writeText(url).then(() => {

    button.classList.add('copied');
    
    setTimeout(() => {
      button.innerHTML = '<i class="fas fa-copy"></i> 复制链接';
      button.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    const textarea = document.createElement('textarea');
    textarea.value = url;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    
    button.innerHTML = '<i class="fas fa-check"></i> 已复制';
    button.classList.add('copied');
    
    setTimeout(() => {
      button.innerHTML = '<i class="fas fa-copy"></i> 复制链接';
      button.classList.remove('copied');
    }, 2000);
  });
}

// ==========================================
// 链接状态管理功能
// ==========================================
function checkLinkStatus(albumId) {
  const albums = getDB('albums');
  const album = albums.find(a => a.id === albumId);
  
  if (!album) return;
  
  showLinkStatusModal(albumId, album.title, album.link, album.linkStatus);
}

function showLinkStatusModal(albumId, title, link, currentStatus) {
  const modalHtml = `
    <div class="modal-overlay" onclick="closeLinkStatusModal()">
      <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 400px;">
        <div class="modal-header">
          <h3>确认链接状态</h3>
          <button class="modal-close" onclick="closeLinkStatusModal()">×</button>
        </div>
        <div class="modal-body">
          <p style="margin-bottom: 1rem;"><strong>图集名称：</strong>${title}</p>
          <p style="margin-bottom: 1rem;"><strong>网盘链接：</strong><a href="${link}" target="_blank" style="color: var(--color-primary);">点击访问</a></p>
          <p style="margin-bottom: 1.5rem; color: var(--color-text-muted);">请访问链接确认状态后选择：</p>
          <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-secondary" onclick="setLinkStatus('${albumId}', 'normal')">
              <i class="fas fa-check-circle"></i>链接正常
            </button>
            <button class="btn btn-danger" onclick="setLinkStatus('${albumId}', 'invalid')">
              <i class="fas fa-times-circle"></i>链接失效
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
  
  const modal = document.createElement('div');
  modal.id = 'linkStatusModal';
  modal.innerHTML = modalHtml;
  document.body.appendChild(modal);
}

function closeLinkStatusModal() {
  const modal = document.getElementById('linkStatusModal');
  if (modal) {
    modal.remove();
  }
}

function setLinkStatus(albumId, status) {
  const albums = getDB('albums');
  const albumIndex = albums.findIndex(a => a.id === albumId);
  
  if (albumIndex !== -1) {
    albums[albumIndex].linkStatus = status;
    setDB('albums', albums);
    alert(`链接状态已更新为: ${status === 'normal' ? '正常' : '失效'}`);
    closeLinkStatusModal();
    renderPage();
  }
}

// ==========================================
// 启动
// ==========================================
window.onload = function() {
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.style.opacity = '0';
    setTimeout(() => overlay.remove(), 300);
  }
  renderPage();
  
  cloudInitAsync();
};

async function cloudInitAsync() {
  try {
    await cloudInit();
    showUpdateNotification();
    renderPage();
  } catch (e) {
    console.warn('云端同步完成（使用本地缓存）');
  }
}

function showUpdateNotification() {
  const existingToast = document.getElementById('syncToast');
  if (existingToast) existingToast.remove();
  
  const toast = document.createElement('div');
  toast.id = 'syncToast';
  toast.style.cssText = `
    position: fixed;
    bottom: 3rem;
    right: 1rem;
    background: linear-gradient(135deg, var(--color-primary), #6d28d9);
    color: white;
    padding: 0.75rem 1.25rem;
    border-radius: 0.5rem;
    box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    animation: slideUp 0.3s ease-out;
    cursor: pointer;
  `;
  toast.innerHTML = `
    <i class="fas fa-cloud-download-alt"></i>
    <span style="font-size: 0.875rem;">数据已更新，点击刷新</span>
  `;
  toast.onclick = function() {
    window.location.reload();
  };
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 5000);
}
</script>
