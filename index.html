<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视觉社 - 资源信息交流社区</title>
  <meta name="description" content="视觉社 - 用户投稿、社区分享、积分解锁的资源信息交流站点">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/logo-192.png">
  <link rel="apple-touch-icon" href="assets/img/logo-192.png">
  <script>
    // 主题在渲染前应用，避免闪烁
    (function () {
      try {
        var t = localStorage.getItem('vs-theme');
        if (t !== 'light' && t !== 'dark') t = 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css?v=20261106">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- 加载遮罩 -->
<div id="loadingOverlay" style="position:fixed;inset:0;background:var(--color-bg);display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="text-align:center;">
    <div style="width:36px;height:36px;border:3px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem;"></div>
    <p style="color:var(--color-text-muted);font-size:0.8125rem;">视觉社 · 正在加载...</p>
  </div>
</div>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>

<!-- 顶部导航 -->
<nav class="navbar">
  <div class="navbar-inner">
    <div class="brand" onclick="App.navigate('home')" style="cursor:pointer;">
      <img class="brand-img" src="assets/img/logo.svg" alt="视觉社" width="36" height="36">
      <h1 class="brand-title">视觉社</h1>
    </div>

    <div class="nav-links">
      <a class="nav-link" data-route="home" onclick="App.navigate('home')">首页</a>
      <a class="nav-link" data-route="forum" onclick="App.navigate('forum')">社区论坛</a>
      <a class="nav-link" data-route="jicha" onclick="App.navigate('jicha')">姬查查名录</a>
      <a class="nav-link" data-route="about" onclick="App.navigate('about')">网站介绍</a>
    </div>

    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" onclick="App.toggleTheme()" title="切换亮色模式" aria-label="切换明暗模式">
        <i class="fas fa-sun"></i>
      </button>

      <div class="nav-search">
        <i class="fas fa-search"></i>
        <input type="text" id="navSearchInput" placeholder="搜索资源、帖子..." autocomplete="off"
          oninput="App.handleSearch(this.value)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();App.searchNow(this.value);}if(event.key==='Escape'){this.value='';App.searchNow('');}">
      </div>

      <div class="points-badge" onclick="App.navigate('profile')">
        <i class="fas fa-coins"></i>
        <span id="navPoints">0</span>
      </div>

      <button class="signin-btn" id="navSigninBtn" onclick="App.doSignin()">
        <i class="fas fa-calendar-check"></i> 签到
      </button>

      <button class="submit-btn" onclick="App.showSubmitModal()">
        <i class="fas fa-plus"></i> 投稿
      </button>

      <div id="userArea"></div>
    </div>

    <button class="mobile-menu-btn" onclick="App.toggleMobileMenu()">
      <i class="fas fa-bars"></i>
    </button>
  </div>
</nav>

<!-- 移动端菜单 -->
<div id="mobileMenu" style="display:none;position:fixed;top:64px;left:0;right:0;background:var(--color-card);border-bottom:1px solid var(--color-border);z-index:99;padding:0.5rem;flex-direction:column;gap:0.25rem;">
  <a class="nav-link" data-route="home" onclick="App.navigate('home');App.toggleMobileMenu()">首页</a>
  <a class="nav-link" data-route="forum" onclick="App.navigate('forum');App.toggleMobileMenu()">社区论坛</a>
  <a class="nav-link" data-route="jicha" onclick="App.navigate('jicha');App.toggleMobileMenu()">姬查查名录</a>
  <a class="nav-link" data-route="about" onclick="App.navigate('about');App.toggleMobileMenu()">网站介绍</a>
</div>

<!-- 主内容区 -->
<main class="page-container">
  <div id="appRoot"></div>
</main>

<!-- 页脚 -->
<footer class="footer">
  <div class="footer-inner">
    <img src="assets/img/logo.svg" alt="视觉社" width="44" height="44" style="border-radius:12px;">
    <div class="footer-links">
      <a onclick="App.navigate('about')" style="cursor:pointer;">网站介绍</a>
      <a onclick="App.showRule()" style="cursor:pointer;">社区规则</a>
      <a onclick="App.showDisclaimer()" style="cursor:pointer;">免责声明</a>
      <a onclick="App.showPrivacy()" style="cursor:pointer;">隐私政策</a>
      <a onclick="App.showReport()" style="cursor:pointer;">举报入口</a>
      <a href="admin/">管理员入口</a>
    </div>
    <p class="footer-text">
      视觉社 · 用户投稿资源信息交流站点<br>
      本站不存储任何资源文件，所有资源由网友自行投稿，网站仅提供信息交流平台<br>
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:inherit;">浙ICP备2026038793号</a>
    </p>
  </div>
</footer>

<!-- Toast 容器 -->
<div id="toastContainer" class="toast-container"></div>

<!-- 模态框容器 -->
<div id="modalContainer"></div>

<script src="assets/js/main.js?v=20261106"></script>
</body>
</html>
